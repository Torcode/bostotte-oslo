name: Datakontrakt

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: datakontrakt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-contract:
    name: Datakontrakt og Python-syntaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Valider datagrunnlaget
        run: >-
          python scripts/validate_phase1.py
          --manifest artifacts/phase1-validation.json

      - name: Kompiler Python-kildene
        run: >-
          python -m compileall -q
          scripts
          data/scripts

      - name: Last opp valideringsmanifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-validation-manifest
          path: artifacts/phase1-validation.json
          if-no-files-found: warn
          retention-days: 14
