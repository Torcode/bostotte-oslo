name: Kildeverifisering

# Kjører verifiser.R fra ren checkout: parser hele bostotte_oslo.qmd i et rent
# C-tegnsett (chunker og inline-uttrykk), kontrollerer at hver sitering har en
# bibliografioppføring, at ingen oppføring ville trykt klammetekst, og at alle
# kryssreferanser har anker. Badgen beviser nøyaktig dette — den beviser IKKE
# at PDF-en kan bygges; det gjør workflowen «Rapport-render (PDF)».

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kildeverifisering-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifiser:
    name: verifiser.R fra ren checkout
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Kjør verifiser.R (stopper på formattererskade)
        run: |
          Rscript -e '
            source("verifiser.R")
            # verifiser.R stopper selv paa formattererskade; parse- og
            # bibliografistatus haandheves her slik at CI blir roed ved feil.
            stopifnot("parsefeil i C-tegnsett" = isTRUE(ok_parse),
                      "sitering uten oppfoering eller klammetekst" = isTRUE(ok_bib))
          '
